services:
  patients-db:
    image: postgres:17
    container_name: patients-db
    env_file:
      - .env
    ports:
      - "5434:5432"
    volumes:
      - patients_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  patients_db_data:
