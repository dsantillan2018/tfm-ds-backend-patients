api:
  version: v1

# Application configuration
spring:
  application:
    name: tfm-ds-backend-patients
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_HOST:http://localhost:8080}/realms/${KEYCLOAK_REALM:tfm-odontologia}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/patients}
    username: ${SPRING_DATASOURCE_USERNAME:patients}
    password: ${SPRING_DATASOURCE_PASSWORD:patients}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Server configuration
server:
  port: 8089
  servlet:
    context-path: /dsantillan/${api.version}

# Eureka client configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    hostname: tfm-ds-backend-patients
